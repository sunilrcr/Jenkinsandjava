apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-app

  template:
    metadata:
      labels:
        app: java-app

    spec:
      containers:
        - name: java-app

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # -----------------------------
          # LIVENESS PROBE
          # -----------------------------
          livenessProbe:
            httpGet:
              path: /helloworld/
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # -----------------------------
          # READINESS PROBE
          # -----------------------------
          readinessProbe:
            httpGet:
              path: /helloworld/
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
